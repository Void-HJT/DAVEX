version: '0.0.1'

my:
  id: !!
  ip: !!
  name: !!
  description: !!
  garnet_path: !!
  base_path: !!
  davex_type: "DAVEX_AGENT"

server:
  port: !!
  
spring:
  application:
    name: DavexAgent
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    druid:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: !!
      username: !!
      password: !!

  jackson:
    serialization:
      write-dates-as-timestamps: false
  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER

mybatis-plus:
  configuration:
    # log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: ASSIGN_ID

threadpool:
  # 核心线程池大小
  corePoolSize: 5
  # 最大线程数
  maxPoolSize: 10
  # 队列容量
  queueCapacity: 100
  # 活跃时间：非核心线程空闲时间超过这个时间就会被回收
  keepAliveSeconds: 60
  # 主线程等待子线程执行时间
  awaitTerminationSeconds: 6000
  # 线程名字前缀
  threadNamePrefix: 'DAVEX-Agent-'

